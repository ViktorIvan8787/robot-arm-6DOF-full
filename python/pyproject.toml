[project]
name = "robot-arm-6dof"
version = "0.7.1"
description = "Camera detection and control software for a 6-DOF robotic arm"
requires-python = ">=3.11,<3.14"

dependencies = [
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pyside6>=6.11.2",
    "pyyaml>=6.0.3",
    "ultralytics>=8.4.126",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]
